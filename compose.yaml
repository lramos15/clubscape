name: clubscape-m1

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: clubscape
      POSTGRES_USER: clubscape
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "clubscape", "-d", "clubscape"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpus: 2
    mem_limit: 512m
    pids_limit: 256

secrets:
  postgres_password:
    file: .local/postgres-password

volumes:
  postgres_data:
