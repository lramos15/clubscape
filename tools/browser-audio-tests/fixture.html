<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>ClubScape source-audio lifecycle TEST FIXTURE — not the game UI</title>
<body>
  <h1>Source-audio lifecycle test fixture</h1>
  <p>Synthetic authoritative snapshots. This is not gameplay or M1 acceptance.</p>
  <button id="unlock">Enable / resume original audio</button>
  <button id="mute">Mute</button>

  <label>Music gain <input id="music" type="range" min="0" max="100" value="100"></label>
  <label>Effects gain <input id="effects" type="range" min="0" max="100" value="100"></label>
  <label>Area gain <input id="area" type="range" min="0" max="100" value="100"></label>
  <label>Native master slider <input id="master" type="range" min="0" max="100" value="100"></label>
  <button id="skip">Source Skip Track</button>
  <button id="toggle-master">Source master mute/unmute</button>
  <button id="toggle-music">Source music mute/unmute</button>
  <button id="toggle-effects">Source effects mute/unmute</button>
  <button id="toggle-area">Source area mute/unmute</button>
  <button id="playlist-0">All music</button>
  <button id="playlist-1">Playlist 1</button>
  <button id="playlist-2">Playlist 2</button>
  <button id="playlist-3">Playlist 3</button>
  <output id="status" aria-live="polite">Loading pinned metadata, not claiming audio permission</output>
  <script type="module" src="/fixture.mjs"></script>
</body>
</html>
