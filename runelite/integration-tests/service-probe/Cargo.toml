[package]
name = "clubscape-runelite-service-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
clubscape-server = { path = "../../../crates/server" }
clubscape-content = { path = "../../../crates/content" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
